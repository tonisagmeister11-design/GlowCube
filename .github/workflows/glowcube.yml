name: GlowCube bauen

# Laeuft bei jeder Aenderung am Client und laesst sich im Reiter "Actions"
# jederzeit von Hand starten ("Run workflow").
on:
  push:
    paths:
      - 'glowcube-client/**'
      - '.github/workflows/glowcube.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    name: Mod uebersetzen und JAR ablegen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glowcube-client

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Aktuelle Fabric-Versionen eintragen
        run: python3 resolve-versions.py

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # Meldet umbenannte Klassen, bricht aber nicht ab - der Build danach
      # findet zusaetzlich die Fehler, die tiefer als der Import sitzen.
      - name: Klassennamen gegen die echten JARs pruefen
        continue-on-error: true
        run: |
          gradle classpathReport --no-daemon -q
          python3 probe-imports.py build/classpath.txt || true
          # Wo der Name nicht weiterhilft, fragt man dort nach, wo die Klasse
          # benutzt wird: was nimmt Screen.render() heute entgegen?
          python3 probe-api.py build/classpath.txt \
            "net.minecraft.client.Minecraft:ouse|creen|Gui|gui" \
            "net.minecraft.client.MouseHandler:rab|isMouse"
          # Die alte Zeichen-API ist komplett ersetzt. Weder Name noch Paket
          # helfen da weiter - also nach Begriffen suchen.
          python3 probe-search.py build/classpath.txt MouseHandler

      - name: Bauen
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Fehler herausziehen
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/gradle.log")
          if not log.exists():
              print("::error title=Build::Kein Gradle-Log - der Abbruch kam vorher.")
              raise SystemExit(0)
          keep = []
          for line in log.read_text(errors="replace").splitlines():
              s = line.strip()
              if s.startswith("at ") or s.startswith("... "):
                  continue          # Stacktrace-Rahmen sagen nichts
              if re.match(r"(Caused by:|FAILURE:|> |\* What went wrong|symbol:|location:|.*\.java:\d+: error:)", s):
                  keep.append(s[:300])
          seen, unique = set(), []
          for line in keep:
              if line not in seen:
                  seen.add(line)
                  unique.append(line)
          print("::error title=Build-Fehler::" + "%0A".join(unique[:15]))
          PY

      - name: JAR anzeigen
        run: |
          echo "### Fertige Dateien" >> "$GITHUB_STEP_SUMMARY"
          ls -la build/libs/
          for jar in build/libs/*.jar; do
            echo "- \`$(basename "$jar")\` ($(du -h "$jar" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: JAR zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: GlowCube-Mod
          path: glowcube-client/build/libs/*.jar
          if-no-files-found: error
          retention-days: 90

      # Artifacts kann nur herunterladen, wer bei GitHub angemeldet ist.
      # Ein Release-Anhang dagegen haengt an einer normalen Adresse, die in
      # jedem Browser funktioniert - auch ohne Konto.
      - name: Als Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Nur die eigentliche Mod, nicht die Quelltext-JAR daneben.
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Veroeffentliche $jar"

          hinweis=$(printf '%s\n' \
            "Fertig gebaute Mod fuer Minecraft Java 26.2 (Fabric)." \
            "" \
            "1. glowcube-1.0.0.jar unten anklicken und herunterladen" \
            "2. Fabric API fuer 26.2 von modrinth.com holen" \
            "3. Beide JARs nach %appdata%\\.minecraft\\mods" \
            "4. Profil fabric-loader-26.2 starten" \
            "" \
            "Tasten: X = X-Ray, F = Flight, C = Zoom." \
            "Alles weitere in glowcube-client/README.md." \
            "" \
            "Automatisch gebaut aus Commit ${GITHUB_SHA}.")

          if gh release view neueste >/dev/null 2>&1; then
            gh release upload neueste "$jar" --clobber
            gh release edit neueste --notes "$hinweis"
          else
            gh release create neueste "$jar" \
              --title "GlowCube - neueste Fassung" \
              --notes "$hinweis"
          fi

          echo "### Direkter Download" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<https://github.com/${GITHUB_REPOSITORY}/releases/latest>" >> "$GITHUB_STEP_SUMMARY"
