name: GlowCube bauen

# Laeuft bei jeder Aenderung am Client und laesst sich im Reiter "Actions"
# jederzeit von Hand starten ("Run workflow").
on:
  push:
    paths:
      - 'glowcube-client/**'
      - 'glowcube-plugin/**'
      - '.github/workflows/glowcube.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    name: Bauen fuer MC ${{ matrix.mc }}
    runs-on: ubuntu-latest
    # Jede Spielfassung ist ein eigener Lauf. Faellt einer um, laufen die
    # anderen trotzdem zu Ende - so kommt wenigstens heraus, welche Fassung
    # bereits baut und welche noch klemmt.
    strategy:
      fail-fast: false
      matrix:
        # 26.2/26.3 sind vorbereitet (src/versionen, SlotKlick/Erz-Ports), aber
        # die 26.x-Render-Pipeline ist noch nicht portiert - deshalb baut die
        # Matrix vorerst nur 1.21.11. Zum Fortsetzen einfach "26.2" (und "26.3")
        # wieder in die Liste aufnehmen.
        mc: ["1.21.11", "26.3"]
    defaults:
      run:
        working-directory: glowcube-client

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Der ganze Build haengt an genau einer Zeile in gradle.properties.
      # Die Matrix setzt sie, resolve-versions.py fuellt den Rest passend auf.
      - name: Zielfassung eintragen
        run: |
          sed -i "s/^minecraft_version=.*/minecraft_version=${{ matrix.mc }}/" gradle.properties
          echo "minecraft_version steht jetzt auf ${{ matrix.mc }}"
          grep '^minecraft_version=' gradle.properties

      - name: Passende Fabric-Versionen eintragen
        run: python3 resolve-versions.py

      # SeedCrackerX mit in die JAR legen, damit nur eine Datei in den
      # mods-Ordner muss. Schlaegt es fehl, laeuft der Build normal weiter.
      - name: SeedCrackerX einbauen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 bundle-seedcracker.py

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # Meldet umbenannte Klassen, bricht aber nicht ab - der Build danach
      # findet zusaetzlich die Fehler, die tiefer als der Import sitzen.
      - name: Klassennamen gegen die echten JARs pruefen
        continue-on-error: true
        run: |
          gradle classpathReport --no-daemon -q
          python3 probe-imports.py build/classpath.txt || true
          # Wo der Name nicht weiterhilft, fragt man dort nach, wo die Klasse
          # benutzt wird: was nimmt Screen.render() heute entgegen?
          python3 probe-api.py build/classpath.txt \
            "net.minecraft.network.Connection:send\\(|channelRead0|genericsFtw" \
            "net.minecraft.client.player.LocalPlayer:sendPosition|sendIsSprinting|move\\(" \
            "net.minecraft.client.multiplayer.MultiPlayerGameMode:startDestroyBlock|useItemOn|attack|interact|handleInventoryMouseClick|ensureHasSentCarriedItem|continueDestroyBlock|stopDestroyBlock|destroyBlock" \
            "net.minecraft.world.entity.player.Inventory:SelectedSlot|getItem|getContainerSize" \
            "net.minecraft.network.CompressionDecoder:" \
            "net.minecraft.nbt.NbtAccounter:unlimited" \
            "net.minecraft.network.FriendlyByteBuf:readNbt" \
            "net.minecraft.world.entity.Entity:moveTo|absMoveTo|setPos|getRootVehicle" \
            "net.minecraft.world.inventory.AbstractContainerMenu:SLOT_CLICKED_OUTSIDE|getCarried|containerId" \
            "net.minecraft.network.protocol.BundlerInfo:" \
            "net.minecraft.world.damagesource.DamageSources:explosion|fall" \
            "net.minecraft.world.damagesource.CombatRules:" \
            "net.minecraft.world.damagesource.DamageSource:scalesWithDifficulty|is\\(" \
            "net.minecraft.world.level.Level:getHeight|damageSources|clip|getMinY|isUnobstructed|getBlockCollisions" \
            "net.minecraft.world.entity.LivingEntity:getAttributeValue|hasEffect|getEffect|getAbsorptionAmount|getItemBySlot" \
            "net.minecraft.world.level.BlockGetter:traverseBlocks|clip" || true
          # Wo der Name selbst unsicher ist, hilft nur die Suche.
          python3 probe-search.py build/classpath.txt CompressionDecoder Bundler ClickType || true

      # 26.3 hat die Render-/GUI-Schicht neu gebaut. Dieser Schritt leuchtet
      # die Nachfolger aus - reines Erzaehlen, bricht nie ab.
      - name: Bewegungspruefung des Servers ausleuchten
        continue-on-error: true
        run: |
          CP=$(grep -v '^\s*$' build/classpath.txt | paste -sd:)
          javap -c -p -classpath "$CP" net.minecraft.server.network.ServerGamePacketListenerImpl > sgpl.txt 2>&1 || true
          javap -c -p -classpath "$CP" net.minecraft.network.protocol.game.ServerboundMovePlayerPacket > smpp.txt 2>&1 || true
          wc -l sgpl.txt smpp.txt
          awk '/containsInvalidValues\(/{f=1} f{print; n++} n>40{f=0;n=0}' sgpl.txt | head -60 || true
          awk '/void handleMovePlayer\(/{f=1} f{print; n++} n>140{exit}' sgpl.txt || true
          grep -n "Pos(\|isFinite\|3.0E7\|INVALID" smpp.txt | head -30 || true
      - name: 26.3-Render-Namen ausleuchten
        continue-on-error: true
        run: |
          python3 probe-api.py build/classpath.txt \
            "net.minecraft.client.renderer.rendertype.RenderTypes:ine|LINE" \
            "net.minecraft.client.renderer.LevelRenderer:renderLineBox|renderShape" \
            "com.mojang.blaze3d.vertex.VertexConsumer:setColor|setNormal|addVertex" || true
          # Die 2D-Schicht: Screen.render() nennt den neuen Graphics-Typ und die
          # Input-Ereignisse selbst - daran haengt das ganze ClickGUI/HUD.
          python3 probe-api.py build/classpath.txt \
            "net.minecraft.client.gui.screens.Screen:render|mouseClicked|mouseDragged|mouseReleased|mouseScrolled|keyPressed|charTyped" \
            "net.minecraft.client.gui.GuiGraphicsExtractor:fill|text|Scissor|pose|gradient|blit|drawString" \
            "net.minecraft.client.gui.GuiGraphics:fill|text|Scissor|pose|gradient|drawString" \
            "net.minecraft.client.input.MouseButtonEvent:" \
            "net.minecraft.client.input.KeyEvent:" \
            "net.minecraft.client.input.CharacterEvent:" \
            "net.minecraft.client.gui.Font:width|lineHeight" || true
          # Das HUD haengt ab 26.x an Fabrics HudElementRegistry statt am alten
          # HudRenderCallback. Dessen register-Signatur brauchen wir wortgenau.
          python3 probe-api.py build/classpath.txt \
            "net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry:" \
            "net.fabricmc.fabric.api.client.rendering.v1.hud.HudElement:" \
            "net.minecraft.resources.Identifier:fromNamespaceAndPath|tryParse|of\\(|parse" \
            "net.minecraft.client.Minecraft:getWindow" \
            "com.mojang.blaze3d.platform.Window:getGuiScaledWidth|getGuiScaledHeight" \
            "net.minecraft.client.gui.render.state.GuiRenderState:" || true
          # Der render-Override greift auf 26.3 nicht - die Renderable-Methode
          # hat eine andere Signatur als (GuiGraphicsExtractor,int,int,float).
          # Hier steht sie wortgenau; dazu der neue Name fuer options.hideGui.
          # Renderable heisst die Zeichenmethode ab 26.x extractRenderState
          # (nicht mehr render); Options fuehrt kein hideGui mehr. Beides ist
          # hier festgehalten - bei Fehlern gibt der Fehler-Schritt die
          # Signaturen zusaetzlich am (tailbaren) Log-Ende aus.
          python3 probe-api.py build/classpath.txt \
            "net.minecraft.client.gui.components.Renderable:" \
            "net.minecraft.client.gui.screens.Screen:extractRenderState|render" \
            "net.minecraft.client.Options:hideGui|hide" || true
          # Die Optik-Module (nach AxolotlClient) haengen an diesen Stellen.
          python3 probe-api.py build/classpath.txt \
            "net.minecraft.client.Camera:setup|alignWithEntity|setRotation|update" \
            "net.minecraft.client.renderer.GameRenderer:bobHurt|bobView" \
            "net.minecraft.client.gui.Gui:ignette" \
            "net.minecraft.client.gui.Hud:ignette" \
            "net.minecraft.client.renderer.ScreenEffectRenderer:ire" \
            "net.minecraft.client.renderer.blockentity.BeaconRenderer:Beam" \
            "net.minecraft.world.level.Level:RainLevel|ThunderLevel" \
            "net.minecraft.client.renderer.entity.LivingEntityRenderer:shouldShowName" \
            "net.minecraft.world.entity.Entity:turn|setCustomName" \
            "net.minecraft.world.entity.item.PrimedTnt:Fuse" \
            "net.minecraft.world.item.ItemStack:HoverName" \
            "net.minecraft.server.packs.repository.PackRepository:Selected" \
            "net.minecraft.server.packs.repository.Pack:Title" || true
          # Performance-Modus: alle Optionen und was das Ressourcenpaket braucht.
          python3 probe-api.py build/classpath.txt \
            "net.minecraft.client.Options:^public .*OptionInstance.* (render|simul|entity|frame|graphic|cloud|weather|cutout|vignette|improved|ambient|chunk|priorit|mipmap)" \
            "net.minecraft.client.Options:^public .*OptionInstance.* (anisotrop|texture|particle|bob|vsync|enableVsync|biome|screenEffect|fov|distortion|damageTilt|glint|darkness|menuBackground|inactivity|hideLightning|fullscreen|showAutosave)" \
            "net.minecraft.client.Options:resourcePacks|save\\(|updateResourcePacks" \
            "com.mojang.blaze3d.platform.NativeImage:read\\(|getPixel|setPixel|writeToFile|<init>|NativeImage\\(int|getWidth|getHeight|close" \
            "net.minecraft.client.Minecraft:ResourcePack|getResourceManager|gameDirectory" \
            "net.minecraft.server.packs.resources.ResourceManager:listResources" \
            "net.minecraft.server.packs.resources.ResourceProvider:" \
            "net.minecraft.server.packs.resources.Resource:open" \
            "net.minecraft.server.packs.repository.PackRepository:reload|setSelected|getSelectedIds|getAvailableIds" \
            "net.minecraft.SharedConstants:getCurrentVersion" \
            "net.minecraft.WorldVersion:pack" \
            "net.minecraft.server.packs.metadata.pack.PackFormat:" \
            "net.minecraft.client.GraphicsStatus:" \
            "net.minecraft.client.GraphicsPreset:" \
            "net.minecraft.client.CloudStatus:" \
            "net.minecraft.server.level.ParticleStatus:" \
            "net.minecraft.client.renderer.LevelRenderer:allChanged" || true
          # Agent: Server-Seite in der eigenen Welt.
          python3 probe-api.py build/classpath.txt \
            "net.minecraft.world.entity.decoration.Mannequin:" \
            "net.minecraft.world.entity.EntityType:MANNEQUIN|public .* create\\(" \
            "net.minecraft.world.entity.Entity:snapTo|moveTo|teleportTo|setNoGravity|setInvulnerable|discard|setYHeadRot|setYBodyRot|setCustomName|setSilent" \
            "net.minecraft.world.entity.LivingEntity:swing|setItemSlot|setYBodyRot" \
            "net.minecraft.world.level.Level:destroyBlockProgress|destroyBlock|playSound\\(|levelEvent" \
            "net.minecraft.world.level.block.Block:getDrops" \
            "net.minecraft.server.level.ServerLevel:setChunkForced|sendParticles|addFreshEntity|getForceLoadedChunks" \
            "net.minecraft.server.level.ServerPlayer:hasPermissions|permissions|getInventory" \
            "net.minecraft.world.entity.player.Player:hasPermissions|permissions|getInventory" \
            "net.minecraft.world.entity.Entity:hasPermissions|permissions|level\\(\\)|serverLevel" \
            "net.minecraft.server.players.PlayerList:getPlayer\\(|isOp" \
            "net.minecraft.server.MinecraftServer:getPlayerList|execute|getLevel\\(" \
            "net.minecraft.client.Minecraft:getSingleplayerServer|hasSingleplayerServer" \
            "net.minecraft.world.entity.item.ItemEntity:<init>|ItemEntity\\(|setPickUpDelay|setDefaultPickUpDelay" \
            "net.minecraft.world.SimpleContainer:addItem|removeAllItems|getContainerSize" \
            "net.minecraft.world.entity.EntitySpawnReason:COMMAND|MOB_SUMMONED" \
            "net.minecraft.tags.BlockTags:LOGS|DIAMOND_ORES|IRON_ORES|GOLD_ORES|COAL_ORES|COPPER_ORES|REDSTONE_ORES|LAPIS_ORES|EMERALD_ORES|BASE_STONE|INCORRECT_FOR" \
            "net.minecraft.world.level.block.state.BlockBehaviour\$BlockStateBase:getDestroySpeed|getCollisionShape|getFluidState|hasBlockEntity|isAir|is\\(" \
            "net.minecraft.world.level.Level:getHeight\\(|dimension\\(" \
            "net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents:" \
            "net.fabricmc.fabric.api.event.lifecycle.v1.ServerLifecycleEvents:" \
            "net.minecraft.server.permissions.PermissionSet:" \
            "net.minecraft.server.permissions.Permissions:" \
            "net.minecraft.server.permissions.PermissionLevel:" \
            "net.minecraft.server.players.NameAndId:" \
            "net.minecraft.server.level.ServerPlayer:nameAndId|getGameProfile" \
            "net.minecraft.world.entity.player.Player:nameAndId|getGameProfile" \
            "net.minecraft.world.item.ItemStack:getDestroySpeed|isCorrectToolForDrops" \
            "net.minecraft.world.level.material.FluidState:isEmpty|is\\(" \
            "net.minecraft.world.entity.Entity:getX\\(|getEyeY|position\\(\\)|blockPosition|getYRot|setYRot|setXRot|isRemoved|getId\\(" || true

      # 26.3-Portierung: Pakete und Signaturen, die Agent, Befehle und das
      # Welt-Rendern auf 26.3 brauchen. Reines Erzaehlen, bricht nie ab.
      # Die Proben oben erzaehlen nur. Hier wird behauptet - und der Lauf
      # faellt um, wenn eine Behauptung nicht stimmt. Sonst faellt ein
      # falscher Mixin-Name erst beim Spielstart auf, und zwar beim Nutzer.
      - name: Namen der Mixin-Ziele festnageln
        run: |
          python3 verify-api.py build/classpath.txt \
            "net.minecraft.network.Connection#genericsFtw" \
            "net.minecraft.network.Connection#channelRead0" \
            "net.minecraft.network.Connection#send" \
            "net.minecraft.client.player.LocalPlayer#sendPosition" \
            "net.minecraft.client.player.LocalPlayer#move" \
            "net.minecraft.client.multiplayer.MultiPlayerGameMode#ensureHasSentCarriedItem" \
            "net.minecraft.client.multiplayer.MultiPlayerGameMode#useItemOn" \
            "net.minecraft.client.multiplayer.MultiPlayerGameMode#startDestroyBlock" \
            "net.minecraft.client.multiplayer.MultiPlayerGameMode#continueDestroyBlock" \
            "net.minecraft.client.multiplayer.MultiPlayerGameMode#stopDestroyBlock" \
            "net.minecraft.client.multiplayer.MultiPlayerGameMode#isDestroying" \
            "net.minecraft.network.CompressionDecoder#decode" \
            "net.minecraft.network.CompressionDecoder#validateDecompressed" \
            "net.minecraft.nbt.NbtAccounter#unlimitedHeap" \
            "net.minecraft.network.FriendlyByteBuf#readNbt" \
            "net.minecraft.world.damagesource.CombatRules#getDamageAfterAbsorb" \
            "net.minecraft.world.entity.player.Inventory#setSelectedSlot" \
            "net.minecraft.world.level.Level#isInSpawnableBounds" \
            "net.minecraft.world.level.CollisionGetter#isUnobstructed" \
            "net.minecraft.world.level.Level#isClientSide()" \
            "net.minecraft.client.multiplayer.ClientPacketListener#sendChat" \
            "net.minecraft.client.multiplayer.ClientPacketListener#sendCommand" \
            "net.minecraft.client.KeyMapping#setDown" \
            "net.minecraft.world.entity.LivingEntity#jumpFromGround" \
            "net.minecraft.world.entity.EntityEvent#PROTECTED_FROM_DEATH" \
            "net.minecraft.network.protocol.game.ClientboundEntityEventPacket#getEventId" \
            "net.minecraft.network.protocol.game.ClientboundEntityEventPacket#getEntity" \
            "net.minecraft.network.protocol.game.ServerboundInteractPacket#entityId" \
            "net.minecraft.world.item.MaceItem#" \
            "net.minecraft.world.entity.AgeableMob#isBaby" \
            "net.minecraft.client.player.LocalPlayer#modifyInput" \
            "net.minecraft.world.phys.Vec2#scale" \
            "net.minecraft.client.player.LocalPlayer#isUsingItem" \
            "net.minecraft.world.food.FoodData#getFoodLevel" \
            "net.minecraft.world.food.FoodData#needsFood" \
            "net.minecraft.world.food.FoodProperties#nutrition" \
            "net.minecraft.world.food.FoodProperties#saturation" \
            "net.minecraft.world.food.FoodProperties#canAlwaysEat" \
            "net.minecraft.core.component.DataComponents#FOOD" \
            "net.minecraft.world.entity.player.Player#getFoodData" \
            "net.minecraft.core.BlockPos#offset" \
            "net.minecraft.world.entity.Entity#distanceTo" \
            "net.minecraft.world.entity.Entity#tickCount" \
            "net.minecraft.world.entity.LivingEntity#getLastHurtByMob" \
            "net.minecraft.world.entity.LivingEntity#getLastHurtByMobTimestamp" \
            "net.minecraft.core.registries.BuiltInRegistries#ITEM" \
            "net.minecraft.world.item.ItemStack#getCount" \
            "net.minecraft.world.inventory.AbstractContainerMenu#getSlot" \
            "net.minecraft.world.inventory.AbstractContainerMenu#slots" \
            "net.minecraft.world.inventory.Slot#getItem" \
            "net.minecraft.world.inventory.CraftingMenu#" \
            "net.minecraft.world.inventory.InventoryMenu#" \
            "net.minecraft.world.entity.player.Player#closeContainer" \
            "net.minecraft.world.level.block.Blocks#CRAFTING_TABLE" \
            "net.minecraft.world.item.Items#CRAFTING_TABLE" \
            "net.minecraft.client.multiplayer.MultiPlayerGameMode#startPrediction" \
            "net.minecraft.network.protocol.game.ServerboundPlayerActionPacket\$Action#START_DESTROY_BLOCK" \
            "net.minecraft.world.entity.player.Player#hasCorrectToolForDrops" \
            "net.minecraft.client.Minecraft#fps" \
            "net.minecraft.world.entity.LivingEntity#activeEffects" \
            "net.minecraft.world.entity.LivingEntity#hurtTime" \
            "net.minecraft.world.effect.MobEffectUtil#formatDuration" \
            "net.minecraft.client.multiplayer.PlayerInfo#getLatency" \
            "net.minecraft.world.entity.Entity#void turn(double, double)" \
            "net.minecraft.world.level.Level#float getRainLevel(float)" \
            "net.minecraft.world.level.Level#float getThunderLevel(float)" \
            "net.minecraft.client.renderer.entity.LivingEntityRenderer#shouldShowName(T, double)" \
            "net.minecraft.client.renderer.blockentity.BeaconRenderer#static void submitBeaconBeam(com.mojang.blaze3d.vertex.PoseStack, net.minecraft.client.renderer.SubmitNodeCollector, net.minecraft.resources.Identifier, float, float, int, int, int, float, float)" \
            "net.minecraft.client.renderer.GameRenderer#void bobHurt(" \
            "net.minecraft.client.Camera#void setRotation(float, float)" \
            "net.minecraft.world.entity.item.PrimedTnt#getFuse" \
            "net.minecraft.server.packs.repository.PackRepository#getSelectedPacks" \
            "net.minecraft.client.PrioritizeChunkUpdates#NONE" \
            "net.minecraft.client.CloudStatus#OFF" \
            "net.minecraft.server.level.ParticleStatus#MINIMAL" \
            "net.minecraft.client.GraphicsPreset#FAST" \
            "net.minecraft.client.TextureFilteringMethod#values" \
            "net.minecraft.resources.Identifier#fromNamespaceAndPath" \
            "net.minecraft.server.packs.repository.PackRepository#void setSelected(" \
            "net.minecraft.client.Minecraft#java.nio.file.Path getResourcePackDirectory()" \
            "com.mojang.blaze3d.platform.NativeImage#public int getPixel(int, int)" \
            "net.minecraft.WorldVersion#packVersion" \
            "net.minecraft.world.entity.player.Player#getDestroySpeed" \
            "net.minecraft.world.phys.Vec3#directionFromRotation" \
            "net.minecraft.world.level.block.Block#isShapeFullBlock" \
            "net.minecraft.world.level.block.FallingBlock#isFree" \
            "net.minecraft.world.entity.Entity#getDirection" \
            "net.minecraft.world.entity.Entity#setOnGround" \
            "net.minecraft.world.level.block.state.BlockBehaviour#hasCollision" \
            "net.minecraft.world.level.block.state.BlockBehaviour#defaultDestroyTime" \
            "net.minecraft.world.level.chunk.LevelChunk#setBlockState(net.minecraft.core.BlockPos, net.minecraft.world.level.block.state.BlockState, int)" \
            "net.minecraft.world.item.BowItem#getPowerForTime" \
            "net.minecraft.world.entity.LivingEntity#getTicksUsingItem" \
            "net.minecraft.client.Options#getEffectiveRenderDistance" \
            "net.minecraft.client.multiplayer.prediction.PredictiveAction#" \
            "net.minecraft.world.level.chunk.LevelChunk#getBlockEntities" \
            "net.minecraft.world.level.chunk.LevelChunkSection#maybeHas" \
            "net.minecraft.world.level.chunk.LevelChunkSection#hasOnlyAir" \
            "net.minecraft.world.level.chunk.ChunkAccess#getSections" \
            "net.minecraft.data.worldgen.placement.OrePlacements#ORE_DIAMOND" \
            "net.minecraft.data.worldgen.placement.OrePlacements#ORE_ANCIENT_DEBRIS_LARGE" \
            "net.minecraft.world.level.biome.FeatureSorter#buildFeaturesPerStep" \
            "net.minecraft.world.level.levelgen.WorldgenRandom#setDecorationSeed" \
            "net.minecraft.world.level.levelgen.WorldgenRandom#setFeatureSeed" \
            "net.minecraft.world.level.levelgen.placement.CountPlacement#count" \
            "net.minecraft.world.level.levelgen.placement.HeightRangePlacement#height" \
            "net.minecraft.world.level.levelgen.placement.RarityFilter#chance" \
            "net.minecraft.world.level.levelgen.presets.WorldPresets#NORMAL" \
            "net.minecraft.world.level.levelgen.feature.ScatteredOreFeature#" \
            "net.minecraft.world.level.LevelHeightAccessor#create" \
            "net.minecraft.world.level.levelgen.WorldGenerationContext#" \
            "net.minecraft.world.level.dimension.LevelStem#NETHER" \
            "net.minecraft.world.entity.Entity#getRootVehicle" \
            "net.minecraft.network.protocol.game.ServerboundMovePlayerPacket\$Pos#" \
            "net.minecraft.network.protocol.game.ServerboundMovePlayerPacket\$Rot#" \
            "net.minecraft.network.protocol.game.ServerboundMovePlayerPacket\$PosRot#" \
            "net.minecraft.network.protocol.game.ClientboundPlayerPositionPacket#" \
            "net.minecraft.network.protocol.game.ServerboundContainerClosePacket#getContainerId" \
            "net.minecraft.world.entity.player.Player#resetAttackStrengthTicker" \
            "net.minecraft.world.entity.player.Player#getAttackStrengthScale" \
            "net.minecraft.world.entity.LivingEntity#onClimbable" \
            "net.minecraft.world.level.BlockGetter#getFluidState" \
            "net.minecraft.world.level.material.FluidState#isEmpty"

          # Ein paar Namen unterscheiden sich zwischen den Fassungen. Sie
          # werden von versionsabhaengigen Quellen (SlotKlick, Erz) oder von
          # der Timer-Doppelinjektion bedient - hier je Fassung der passende
          # Name festgenagelt, damit ein Tippfehler nicht erst beim Nutzer
          # auffliegt.
          mcv='${{ matrix.mc }}'
          if [[ "$mcv" == 1.* ]]; then
            python3 verify-api.py build/classpath.txt \
              "net.minecraft.client.DeltaTracker\$Timer#advanceTime" \
              "net.minecraft.world.inventory.ClickType#QUICK_MOVE" \
              "net.minecraft.world.inventory.ClickType#PICKUP" \
              "net.minecraft.client.multiplayer.MultiPlayerGameMode#handleInventoryMouseClick" \
              "net.minecraft.network.protocol.game.ClientboundSetEntityMotionPacket#getId" \
              "net.minecraft.client.Camera#void setup(" \
              "net.minecraft.client.gui.Gui#void renderVignette(" \
              "net.minecraft.client.renderer.ScreenEffectRenderer#static void renderFire(com.mojang.blaze3d.vertex.PoseStack, net.minecraft.client.renderer.MultiBufferSource, net.minecraft.client.renderer.texture.TextureAtlasSprite)" \
              "net.minecraft.world.entity.EntityType#MANNEQUIN" \
              "net.minecraft.world.entity.LivingEntity#void swing(net.minecraft.world.InteractionHand, boolean)" \
              "net.minecraft.server.level.ServerLevel#boolean setChunkForced(int, int, boolean)"
          else
            python3 verify-api.py build/classpath.txt \
              "net.minecraft.client.DeltaTracker\$Timer#advanceGameTime" \
              "net.minecraft.world.inventory.ContainerInput#QUICK_MOVE" \
              "net.minecraft.world.inventory.ContainerInput#PICKUP" \
              "net.minecraft.client.multiplayer.MultiPlayerGameMode#handleContainerInput" \
              "net.minecraft.network.protocol.game.ClientboundSetEntityMotionPacket#id" \
              "net.minecraft.client.Minecraft#levelExtractor" \
              "net.minecraft.client.renderer.extract.LevelExtractor#allChanged" \
              "net.minecraft.client.gui.GuiGraphicsExtractor#itemDecorations" \
              "net.minecraft.client.Camera#void alignWithEntity(float)" \
              "net.minecraft.client.gui.Hud#void extractVignette(" \
              "net.minecraft.client.renderer.ScreenEffectRenderer#static void lambda\$submitFire\$0(" \
              "net.minecraft.client.renderer.LevelRenderer#collectPerFrameRenderThreadGizmos" \
              "net.minecraft.gizmos.Gizmos#cuboid" \
              "net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents#COLLECT_SUBMITS" \
              "net.fabricmc.fabric.api.client.command.v2.ClientCommands#literal" \
              "net.minecraft.world.level.levelgen.feature.AbstractOreFeature#"
          fi
          # Die volle OreSim-Weltgenerierung laeuft nur dort, wo die alte
          # Erz-Konfiguration noch existiert (1.21.x und 26.2).
          if [[ "$mcv" == 26.3 ]]; then
            python3 verify-api.py build/classpath.txt \
              "net.minecraft.data.registries.VanillaRegistries#createWorldLookup"
          fi
          if [[ "$mcv" == 1.* || "$mcv" == "26.2" ]]; then
            python3 verify-api.py build/classpath.txt \
              "net.minecraft.data.registries.VanillaRegistries#createLookup" \
              "net.minecraft.world.level.levelgen.feature.configurations.OreConfiguration#discardChanceOnAirExposure"
          fi

      # Ein Mixin, das nicht eingetragen ist, wird nie geladen - das Modul
      # dahinter tut dann einfach nichts, ohne dass irgendwo ein Fehler steht.
      - name: Mixin-Liste gegen die Dateien pruefen
        run: python3 check-mixins.py

      - name: Bauen
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Fehler herausziehen
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/gradle.log")
          if not log.exists():
              print("::error title=Build::Kein Gradle-Log - der Abbruch kam vorher.")
              raise SystemExit(0)
          keep = []
          for line in log.read_text(errors="replace").splitlines():
              s = line.strip()
              if s.startswith("at ") or s.startswith("... "):
                  continue          # Stacktrace-Rahmen sagen nichts
              if re.match(r"(Caused by:|FAILURE:|> |\* What went wrong|symbol:|location:|.*\.java:\d+: error:)", s):
                  keep.append(s[:300])
          seen, unique = set(), []
          for line in keep:
              if line not in seen:
                  seen.add(line)
                  unique.append(line)
          print("::error title=Build-Fehler::" + "%0A".join(unique[:15]))
          print("===== ALLE FEHLER =====")
          roh = log.read_text(errors="replace").splitlines()
          for i, line in enumerate(roh):
              if re.search(r"\.java:\d+: error:", line):
                  teil = line.split("/src/", 1)[-1]
                  mehr = [z.strip() for z in roh[i + 1:i + 5] if z.strip().startswith(("symbol:", "location:", "required:", "found:", "reason:"))]
                  print("FEHLER " + teil[:260] + (" || " + " | ".join(mehr) if mehr else ""))
          PY

      # Die fertige Mod bekommt die Spielfassung in den Dateinamen, damit
      # spaeter unverwechselbar ist, welche JAR zu welchem Minecraft gehoert.
      - name: JAR benennen und einsammeln
        run: |
          mkdir -p /tmp/ausgabe
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          ziel="glowcube-${{ matrix.mc }}.jar"
          cp "$jar" "/tmp/ausgabe/${ziel}"
          echo "### Fertige Datei fuer ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${ziel}\` ($(du -h "/tmp/ausgabe/${ziel}" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: JAR zum Weiterreichen ablegen
        uses: actions/upload-artifact@v4
        with:
          name: glowcube-mc-${{ matrix.mc }}
          path: /tmp/ausgabe/*.jar
          if-no-files-found: error
          retention-days: 90

  # Spieltest: das echte Spiel startet (virtueller Bildschirm), legt eine Welt
  # an und prueft X-Ray, ESP, KillAura, Agenten und jedes Modul. Ergebnis als
  # Zeilen "GLOWCUBE-TEST ..." im Protokoll und in der Zusammenfassung.
  spieltest:
    name: Spieltest MC ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.3"]
    defaults:
      run:
        working-directory: glowcube-client
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Zielfassung eintragen
        run: sed -i "s/^minecraft_version=.*/minecraft_version=${{ matrix.mc }}/" gradle.properties

      - name: Passende Fabric-Versionen eintragen
        run: python3 resolve-versions.py

      - name: Grafik fuer den virtuellen Bildschirm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 > /dev/null

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Spiel starten und pruefen
        continue-on-error: true
        run: |
          set -o pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          export LP_NUM_THREADS=1
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" \
            gradle runClientGameTest -Pspieltest --no-daemon --stacktrace 2>&1 | tee /tmp/spieltest.log

      - name: Ergebnis
        if: always()
        run: |
          echo "### Spieltest ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "GLOWCUBE-SPIELTEST" /tmp/spieltest.log; then
            sed -n '/===== GLOWCUBE-SPIELTEST/,$p' /tmp/spieltest.log | grep -E "GLOWCUBE" | sed 's/^.*\(GLOWCUBE\)/\1/' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Der Spieltest ist nicht bis zum Ende gekommen. Letzte Zeilen:" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E "Exception|Error|error:|FAILED|Caused by|GLOWCUBE|crash|Crash" /tmp/spieltest.log | tail -60 | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "===== ENDE SPIELTEST ====="

  # Das Server-Plugin fuer Paper: damit laufen die Agenten auch auf einem
  # Server, fuer jeden Spieler mit GlowCube.
  plugin:
    name: Server-Plugin bauen fuer Paper ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21.11", "26.3"]
    defaults:
      run:
        working-directory: glowcube-plugin
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Passende Paper-API suchen
        id: paper
        run: python3 paper-fassung.py "${{ matrix.mc }}"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace -Pmc=${{ matrix.mc }} \
            -Ppaper_version=${{ steps.paper.outputs.paper_version }} \
            -Pjava_version=${{ steps.paper.outputs.java_version }} 2>&1 | tee /tmp/gradle.log

      - name: Fehler herausziehen
        if: failure()
        run: |
          grep -E "error:|warning: \[|What went wrong|Could not" /tmp/gradle.log | head -40 | sed 's/^/::error::/' || true
          grep -E "\.java:[0-9]+: error:" -A3 /tmp/gradle.log | head -120 || true

      # Ein echter Paper-Server mit dem Plugin: startet er, und laedt das Plugin sauber?
      - name: Auf echtem Paper-Server testen
        continue-on-error: true
        run: ./server-test.sh "${{ matrix.mc }}" "$PWD/build/libs/glowcube-agent-plugin-${{ matrix.mc }}.jar"

      - name: JAR einsammeln
        run: |
          mkdir -p /tmp/ausgabe
          cp build/libs/glowcube-agent-plugin-${{ matrix.mc }}.jar /tmp/ausgabe/
          echo "### Server-Plugin fuer Paper ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`glowcube-agent-plugin-${{ matrix.mc }}.jar\`" >> "$GITHUB_STEP_SUMMARY"

      - name: JAR zum Weiterreichen ablegen
        uses: actions/upload-artifact@v4
        with:
          name: glowcube-mc-plugin-${{ matrix.mc }}
          path: /tmp/ausgabe/*.jar
          if-no-files-found: error
          retention-days: 90

  veroeffentlichen:
    name: Alle Fassungen veroeffentlichen
    runs-on: ubuntu-latest
    needs: [bauen, plugin]
    # Auch wenn eine Fassung noch nicht baut, sollen die fertigen trotzdem
    # herauskommen. Der Schritt sammelt schlicht ein, was da ist.
    if: ${{ always() }}

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Gebaute JARs holen
        uses: actions/download-artifact@v4
        with:
          path: eingesammelt
          pattern: glowcube-mc-*
          merge-multiple: true

      - name: Veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(eingesammelt/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "::error title=Release::Keine einzige Fassung ist gebaut worden."
            exit 1
          fi
          echo "Gefundene Fassungen:"
          printf '  %s\n' "${jars[@]}"

          # Aus den Dateinamen (glowcube-<fassung>.jar) die Liste der Fassungen
          # gewinnen, die es in dieses Release geschafft haben.
          fassungen=""
          for j in "${jars[@]}"; do
            f=$(basename "$j" .jar); f=${f#glowcube-}
            case "$f" in agent-plugin*) continue ;; esac
            fassungen="${fassungen} ${f}"
          done

          hinweis=$(printf '%s\n' \
            "Fertig gebaute GlowCube-Mod (Fabric) fuer Minecraft Java:" \
            "  ${fassungen}" \
            "" \
            "Lade die JAR, die zu deiner Minecraft-Fassung passt" \
            "(der Dateiname nennt die Fassung, z. B. glowcube-1.21.11.jar)." \
            "" \
            "SeedCrackerX steckt schon drin - keine zweite Datei noetig." \
            "" \
            "1. Passende glowcube-<fassung>.jar unten anklicken und herunterladen" \
            "2. Fabric API fuer dieselbe Fassung von modrinth.com holen" \
            "3. Beide JARs nach %appdata%\\.minecraft\\mods" \
            "4. Profil fabric-loader-<fassung> starten" \
            "" \
            "Rechte Umschalttaste oeffnet das Menue - dort laesst sich" \
            "jedes Modul ein- und ausschalten und neu belegen." \
            "Vorbelegt: X = X-Ray, B = SeedHunt." \
            "Alles weitere in glowcube-client/README.md." \
            "" \
            "Fuer Server: glowcube-agent-plugin-1.21.11.jar (Paper 1.21.11)" \
            "bzw. glowcube-agent-plugin-26.3.jar (Paper 26.3) in den" \
            "plugins-Ordner. Dann kann jeder Spieler mit GlowCube dort" \
            "Agenten losschicken." \
            "" \
            "Automatisch gebaut aus Commit ${GITHUB_SHA}.")

          # Die Namen, die in dieses Release gehoeren.
          aktuelle=""
          for j in "${jars[@]}"; do aktuelle="${aktuelle} $(basename "$j")"; done

          # "neueste" ist der immer gleiche Link auf die aktuelle Fassung.
          if gh release view neueste >/dev/null 2>&1; then
            # Veraltete, andersnamige JARs (z. B. aus einem frueheren
            # Namensschema wie glowcube-1.0.0.jar) entfernen, damit niemand
            # aus Versehen eine alte Datei zieht.
            for vorhanden in $(gh release view neueste --json assets -q '.assets[].name'); do
              case "$vorhanden" in
                *.jar)
                  if ! printf '%s\n' $aktuelle | grep -qx "$vorhanden"; then
                    echo "Entferne veraltete Datei $vorhanden aus 'neueste'"
                    gh release delete-asset neueste "$vorhanden" -y || true
                  fi ;;
              esac
            done
            gh release upload neueste "${jars[@]}" --clobber
            gh release edit neueste --notes "$hinweis"
          else
            gh release create neueste "${jars[@]}" \
              --title "GlowCube - neueste Fassung" \
              --notes "$hinweis"
          fi

          # Zusaetzlich eine bleibende Fassung, damit alte Staende erhalten
          # bleiben. Benannt nach der Laufnummer, die nie wieder vorkommt.
          nummer="${GITHUB_RUN_NUMBER}"
          bleibend="v${nummer}"
          if ! gh release view "$bleibend" >/dev/null 2>&1; then
            gh release create "$bleibend" "${jars[@]}" \
              --title "GlowCube Client ${nummer}" \
              --notes "$hinweis"
          else
            gh release upload "$bleibend" "${jars[@]}" --clobber
          fi

          {
            echo "### Veroeffentlichte Fassungen"
            for j in "${jars[@]}"; do echo "- \`$(basename "$j")\`"; done
            echo ""
            echo "### Direkter Download"
            echo "<https://github.com/${GITHUB_REPOSITORY}/releases/latest>"
          } >> "$GITHUB_STEP_SUMMARY"
