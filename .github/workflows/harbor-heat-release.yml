# Joins the prebuilt parts into one HarborHeat.exe and publishes it as a GitHub release.
name: Harbor Heat download

on:
  push:
    branches: ["harbor-heat-download"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join parts
        run: |
          cat parts/HarborHeat.exe.part* > HarborHeat.exe
          echo "$(cat parts/SHA256)  HarborHeat.exe" | sha256sum -c -
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: harbor-heat-v2.4
          name: Harbor Heat v2.4
          target_commitish: harbor-heat-download
          make_latest: true
          body: |
            **Harbor Heat v2.4** – open-world action in Port Aurelia (Windows 10/11, 64-bit).
            Download `HarborHeat.exe`, double-click, play. Nothing to install.

            2.4: much less lag when driving fast across the city · going back to the main menu or
            quitting saves automatically (position, money, your cars) · T calls your car anytime ·
            250 health, weaker weapons, the police miss a lot more · drive up kerbs without
            stopping dead, faster reverse · switch weapons (1-9 / mouse wheel) and reload in the car ·
            more parked cars at night · pedestrians greet you, chat, comment on your car and complain;
            some troublemakers insult you and start fist fights (fighting back is no crime).

            2.3 (big texture update): smooth, natural people (no more bulging muscles or lumpy
            faces, clothes without clipping) · buildings with real 3D facades: window frames, sills,
            shutters, flower boxes, AC units, glass fins on towers and balconies that stick out ·
            redesigned street lamps (LED masts, classic lanterns, highway masts) · cars with random
            paint jobs: racing stripes, two-tone, fades, race numbers, company and sponsor logos,
            metallic/pearl/matte/candy paint · new ground textures: asphalt, sidewalks, grass, brick,
            plaster, concrete.

            2.2: car radio with three songs (+/- volume), chase music when the police are on your
            heels, roads over the hills are drivable everywhere, no stars for missed shots or for
            stopping thieves, reverse up to 50 km/h, slower police cars, own aiming per weapon,
            endless rockets, keep stolen cars (J) and call your cars from the map (T), new legal and
            illegal jobs, no more black speckles indoors, safe return to the main menu.

            2.1: every shop now sells its own goods (gadgets and a police scanner at the
            electronics store, car parts and nitro at gas stations, meals at the diner) and has a
            matching interior.

            New in 2.0: rob every shop (aim at the shopkeeper), jewelry stores and a gun shop that
            fights back · sports cars up to ~290 km/h, nitro (N), street races in three classes ·
            rocket launcher, grenade launcher, minigun and more · knock over lamp posts ·
            new big-money contracts with checkpoints · surrender to the police (X) and serve your
            time · creative mode · NPCs dodge cars and shout for help · expensive real estate.

            Weak laptop: open Settings, switch on PERFORMANCE MODE at the top, restart.
            If Windows SmartScreen warns: "More info" > "Run anyway" (unsigned build).
          files: HarborHeat.exe
