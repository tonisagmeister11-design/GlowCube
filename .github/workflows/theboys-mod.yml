name: The Boys Mod

on:
  push:
    paths:
      - 'theboys-mod/**'
      - '.github/workflows/theboys-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: theboys-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theboys-mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: API reference
        if: hashFiles('theboys-mod/ci/javap.txt') != ''
        run: ./gradlew dumpApi --quiet --console=plain || true

      - name: Build
        run: ./gradlew build --console=plain

      - name: Publish jar to build branch
        if: success()
        run: |
          JAR=$(ls build/libs/theboys-*.jar | grep -v sources | head -n1)
          echo "Built: $JAR"
          mkdir -p /tmp/out && cp "$JAR" /tmp/out/theboys.jar
          cd /tmp/out
          git init -q -b theboys-mod-build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Built from ${GITHUB_SHA}" > BUILD.txt
          git add theboys.jar BUILD.txt
          git commit -q -m "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" theboys-mod-build
