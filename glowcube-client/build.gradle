// Loom wird ueber buildscript geladen statt ueber den plugins-Block, weil die
// Plugin-Kennung nicht mehr feststeht: fuer obfuskierte Fassungen heisst sie
// 'fabric-loom', fuer die unobfuskierten ab 26.1 'net.fabricmc.fabric-loom'.
// Nur so laesst sie sich aus gradle.properties setzen - der plugins-Block
// erlaubt dort keine Variablen.
buildscript {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

apply plugin: project.loom_plugin_id
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

// Das klassische Loom remappt Mods und legt dafuer modImplementation an.
// Das neue remappt nichts, kennt die Konfiguration also gar nicht - dort
// sind Mods ganz normale Abhaengigkeiten. Statt das aus der Plugin-Kennung
// abzuleiten, wird schlicht nachgesehen, was existiert.
def modConfiguration = configurations.findByName('modImplementation') ? 'modImplementation' : 'implementation'
logger.lifecycle("GlowCube: Mod-Abhaengigkeiten ueber ${modConfiguration}")

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Ob es hier etwas zu tun gibt, haengt an der Spielfassung: seit 26.1 ist
    // Minecraft unobfuskiert und bringt gar keine mappings-Datei mehr mit.
    // resolve-versions.py sieht bei Mojang nach und setzt mappings_mode -
    // geraten wird hier nichts mehr.
    if (project.mappings_mode == 'mojang') {
        mappings loom.officialMojangMappings()
    } else if (project.mappings_mode == 'intermediary') {
        mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    }

    add(modConfiguration, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modConfiguration, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
}

// Denselben Gedanken noch einmal: der mixin-Block schaltet die alte
// Remapping-Kette samt refmap ab. Wo nichts remappt wird, gibt es ihn nicht.
if (project.extensions.findByName('loom') != null) {
    loom {
        try {
            mixin {
                useLegacyMixinAp = false
            }
        } catch (MissingMethodException ignored) {
            logger.lifecycle('GlowCube: Loom kennt keinen mixin-Block - unobfuskiert, nichts abzuschalten.')
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

// Schreibt heraus, welche JARs beim Uebersetzen wirklich benutzt werden.
// probe-imports.py liest das und sagt, wie die Klassen in dieser Fassung
// heissen - das ist schneller, als jeden Namen einzeln per Fehlversuch zu
// erfragen.
tasks.register('classpathReport') {
    doLast {
        def ziel = layout.buildDirectory.file('classpath.txt').get().asFile
        ziel.parentFile.mkdirs()
        ziel.text = sourceSets.main.compileClasspath.files
                .collect { it.absolutePath }
                .join('\n')
        println "Classpath steht in ${ziel}"
    }
}
