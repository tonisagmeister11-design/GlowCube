// Das GlowCube-Agent-Plugin fuer Paper-Server. Gebaut gegen die Paper-API
// der Fassung, fuer die auch der Client gebaut wird (1.21.11).
plugins {
    id 'java'
}

group = 'net.glowcube'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { name = 'papermc'; url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${project.findProperty('paper_version') ?: '1.21.11-R0.1-SNAPSHOT'}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('plugin.yml') {
        expand version: project.version
    }
}

jar {
    archiveFileName = 'glowcube-agent-plugin.jar'
}
