# GlowCube-Agent-Plugin
#
# Wer den GlowCube-Client hat, kann ueber das Menue (Kein Hack -> Agent)
# Agenten losschicken. Wer das darf, regelt die Berechtigung glowcube.agent
# (Standard: jeder). Hier die Grenzen:

# Wie viele Agenten ein Spieler gleichzeitig haben darf - insgesamt und je
# Art (Erz, Stein, Holz, Guardian, Builder, Farm, Tunnel, Jaeger).
max-agenten-je-spieler: 20
max-agenten-je-art: 5

# Obergrenzen fuer die Einstellungen aus dem Client.
max-tempo: 4.0
max-abbau-tempo: 20.0
max-xray-chunks: 6
# Builder: hoechstens so viele Bloecke pro Sekunde.
max-bau-tempo: 100.0

# Tunnel-Agent: hoechstens so viele Bloecke lang.
max-tunnel-laenge: 512

# Darf der Agent X-Ray benutzen?
xray-erlaubt: true

# PvP Pro (GlowCube-Client, Kampf-Automatik) auf diesem Server erlauben?
# Benutzen kann es nur, wer den GlowCube-Client installiert hat - und nur,
# solange dieses Plugin auf dem Server liegt. Mit false ist es hier aus.
pvp-pro-erlaubt: true

# Orbital Strike: Ziel mit /strike x y z im GlowCube-Client setzen, dann den
# Hebel oben auf der Orbital Strike Cannon umlegen. Mit false ist er hier aus.
orbital-strike-erlaubt: true
