name: GlowCubeAgent
version: '${version}'
main: net.glowcube.plugin.GlowCubeAgentPlugin
api-version: '${apiFassung}'
description: Agenten fuer Spieler mit dem GlowCube-Client (Paper ${fassung}) - Abbau, Farm, Tunnel, Guardian, Jaeger, Builder.
author: GlowCube
permissions:
  glowcube.agent:
    description: Darf Agenten losschicken.
    default: true
  glowcube.pvppro:
    description: Darf PvP Pro im GlowCube-Client benutzen (nur wenn pvp-pro-erlaubt an ist).
    default: true
  glowcube.orbital:
    description: Darf den Orbital Strike (Hebel auf der Orbital Strike Cannon) benutzen.
    default: true
