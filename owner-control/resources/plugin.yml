name: OwnerControl
version: 2.0.0
main: de.ownercontrol.OwnerControlPlugin
api-version: '26.3'
author: Owner
description: Admin-Steuerung von Spielern per /control (Passwort-geschuetzt).
commands:
  control:
    description: Spieler steuern und Admin-Streiche
    usage: /control help
    aliases: [ctl]
  uncontrol:
    description: Steuerung beenden
    usage: /uncontrol
permissions:
  control.admin:
    description: Darf /control benutzen (zusaetzlich Passwort)
    default: op
