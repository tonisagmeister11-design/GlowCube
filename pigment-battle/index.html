<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Pigment Krieg</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: Kampf-Canvas füllt alles, Menüs & HUD schweben als Tinten-Glas darüber */
:root {
  --ink: #0b0b0d; --paper: #f6f6f2; --glass: rgba(14,14,18,0.78); --line: rgba(255,255,255,0.14);
  --gold: #ffcc3d; --hp: #5cff8a; --bad: #ff4a4a; --text: #f2f0ea; --mute: #a9a6a0;
  --display: 'Bungee', Impact, 'Arial Black', sans-serif; --body: 'Rubik', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); font-family: var(--body); user-select: none; -webkit-user-select: none; touch-action: none; }
#game { position: fixed; inset: 0; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.screen { position: fixed; inset: 0; pointer-events: none; }
.screen > * { pointer-events: auto; }

/* ---------- Menü ---------- */
#menu { display: flex; flex-direction: column; padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); gap: 10px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--display); font-size: clamp(26px, 5vw, 56px); line-height: .9; letter-spacing: .02em; margin: 0 auto 0 0; flex: none;
  background: linear-gradient(90deg, #050505 0 49.5%, #fafafa 50.5% 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 1px #888) drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
.logo small { display: block; font-family: var(--body); font-weight: 800; font-size: 11px; letter-spacing: .32em; color: var(--mute); -webkit-text-fill-color: var(--mute); background: none; margin-top: 4px; }
.coins { font-family: var(--display); font-size: 18px; background: var(--glass); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; color: var(--gold); white-space: nowrap; }
.snd { width: 40px; height: 40px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line); font-size: 18px; }
.panel { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; min-height: 0; flex: 0 1 auto; max-width: 1100px; width: 100%; margin: 0 auto; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; padding: 12px 6px; font-family: var(--display); font-size: clamp(12px, 2vw, 16px); color: var(--mute); letter-spacing: .04em; position: relative; }
.tab.on { color: var(--text); }
.tab.on::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: -1px; height: 3px; background: linear-gradient(90deg, #000 50%, #fff 50%); border-radius: 3px; box-shadow: 0 0 0 1px #777; }
.pane { overflow-y: auto; padding: 14px; flex: 1 1 auto; min-height: 0; touch-action: pan-y; }
h3 { font-family: var(--display); font-size: 13px; letter-spacing: .12em; color: var(--mute); margin: 4px 0 10px; font-weight: 400; }

.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.team { border-radius: 14px; padding: 8px; display: flex; align-items: center; gap: 10px; border: 2px solid transparent; transition: transform .15s; }
.team canvas { width: 72px; height: 72px; flex: none; }
.team b { font-family: var(--display); font-size: clamp(16px, 2.6vw, 24px); font-weight: 400; display: block; }
.team span { font-size: 12px; opacity: .7; }
#team_black { background: linear-gradient(135deg, #1b1b1f, #050506); color: #fafafa; }
#team_white { background: linear-gradient(135deg, #ffffff, #d8d8d2); color: #0b0b0d; }
.team.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,204,61,.25), 0 8px 24px rgba(0,0,0,.4); transform: translateY(-2px); }

.arenas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.arena { border-radius: 12px; overflow: hidden; background: #111; border: 2px solid transparent; text-align: left; padding: 0; transition: transform .15s; }
.arena canvas { width: 100%; height: auto; aspect-ratio: 2/1; display: block; }
.arena .an { font-family: var(--display); font-size: 13px; padding: 6px 8px 0; }
.arena .am { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 8px 8px; color: var(--mute); }
.arena .am span:first-child { color: var(--gold); letter-spacing: 1px; }
.arena.on { border-color: var(--gold); transform: translateY(-2px); }

.go { font-family: var(--display); font-size: clamp(20px, 3.5vw, 30px); width: 100%; padding: 14px; border-radius: 14px; color: #0b0b0d;
  background: linear-gradient(90deg, #fff 0%, #ffcc3d 50%, #fff 100%); background-size: 200% 100%; animation: shine 3s linear infinite; box-shadow: 0 6px 0 #9a7412, 0 10px 30px rgba(255,204,61,.3); }
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 #9a7412; }
@keyframes shine { to { background-position: -200% 0; } }

.shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.item { background: rgba(255,255,255,.05); border: 2px solid var(--line); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.item canvas { width: 100%; max-width: 140px; height: auto; aspect-ratio: 16/17; background: radial-gradient(circle at 50% 70%, #6b6f7a, #34363d); border-radius: 10px; }
.item .in { font-family: var(--display); font-size: 13px; text-align: center; }
.item.on { border-color: var(--gold); }
.item.special { border-color: #ff4df5; box-shadow: 0 0 18px rgba(255,77,245,.25); }
.item.special .in::after { content: " ★"; color: #ff4df5; }
.buy { width: 100%; padding: 9px 8px; border-radius: 10px; background: var(--gold); color: #0b0b0d; font-weight: 800; font-size: 13px; }
.buy:disabled { background: #3a3a40; color: #8d8b86; cursor: default; }

.urow { display: grid; grid-template-columns: 74px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--line); margin-bottom: 8px; }
.urow canvas { width: 74px; height: 74px; background: radial-gradient(circle at 50% 70%, #6b6f7a, #34363d); border-radius: 10px; }
.urow .ico { width: 74px; height: 74px; display: grid; place-items: center; font-size: 34px; background: rgba(0,0,0,.3); border-radius: 10px; }
.urow .buy { width: auto; min-width: 120px; }
.un { font-family: var(--display); font-size: 15px; }
.un small { font-family: var(--body); font-size: 12px; color: var(--gold); margin-left: 4px; }
.ud { font-size: 12px; color: var(--mute); margin: 2px 0 6px; }
.us { font-size: 11px; color: var(--mute); margin-top: 4px; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 4px; }
.pips i { width: 18px; height: 6px; border-radius: 3px; border: 1px solid; }

/* ---------- HUD ---------- */
#hud .hudtop { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); }
.hpwrap { flex: 1; min-width: 0; }
.hpbar { height: 12px; background: rgba(0,0,0,.55); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.hpbar div { height: 100%; transition: width .2s; }
#hpL { background: linear-gradient(90deg, #38d16a, #9cff8a); }
#hpR { background: linear-gradient(90deg, #ff8a5c, #ff3d3d); margin-left: auto; }
.hplab { font-size: 11px; font-weight: 800; letter-spacing: .1em; margin-bottom: 3px; display: flex; justify-content: space-between; text-shadow: 0 1px 2px #000; }
.mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
#mini { width: min(30vw, 260px); height: 26px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
#arenaName { font-size: 10px; letter-spacing: .2em; color: var(--mute); text-transform: uppercase; text-shadow: 0 1px 2px #000; }
.ibtn { width: 40px; height: 40px; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); font-size: 18px; flex: none; }
#gold { position: absolute; left: max(12px, env(safe-area-inset-left)); top: calc(max(8px, env(safe-area-inset-top)) + 52px); font-family: var(--display); font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 #000, 0 0 12px rgba(255,204,61,.4); display: flex; gap: 14px; align-items: baseline; }
#gold small { font-family: var(--body); font-size: 12px; color: var(--text); font-weight: 600; }
#gold.shake { animation: shk .35s; }
@keyframes shk { 20%,60% { transform: translateX(-6px); color: var(--bad); } 40%,80% { transform: translateX(6px); } }
.cmds { position: absolute; right: max(12px, env(safe-area-inset-right)); top: calc(max(8px, env(safe-area-inset-top)) + 50px); display: flex; gap: 6px; }
.cmd { padding: 8px 12px; border-radius: 10px; background: var(--glass); border: 1px solid var(--line); font-weight: 800; font-size: 12px; letter-spacing: .06em; }
.cmd.on { background: var(--paper); color: var(--ink); }
#bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); background: linear-gradient(transparent, rgba(0,0,0,.7) 35%); }
#units { display: flex; gap: 8px; justify-content: center; }
.ubtn { position: relative; width: min(17vw, 96px); aspect-ratio: 1/1.12; border-radius: 14px; background: linear-gradient(180deg, #5d606a, #2b2d33); border: 2px solid rgba(255,255,255,.2); overflow: hidden; box-shadow: 0 4px 0 #111; transition: transform .08s; }
.ubtn canvas { position: absolute; inset: 4% 8% 22%; width: 84%; height: 74%; }
.ubtn .cost { position: absolute; top: 4px; right: 6px; font-family: var(--display); font-size: 12px; color: var(--gold); text-shadow: 0 1px 0 #000; }
.ubtn .nm { position: absolute; bottom: 4px; left: 0; right: 0; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.ubtn .key { position: absolute; top: 4px; left: 6px; font-size: 10px; opacity: .5; }
.ubtn .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.6); pointer-events: none; }
.ubtn.poor { filter: grayscale(1) brightness(.6); }
.ubtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #111; }
.ubtn.pop { animation: pop .25s; }
@keyframes pop { 50% { transform: scale(1.12); border-color: var(--gold); } }
@media (pointer: coarse) { .ubtn .key { display: none; } }

/* ---------- Overlays ---------- */
.modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 16px; z-index: 10; }
.card { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 22px; min-width: min(360px, 100%); text-align: center; display: flex; flex-direction: column; gap: 12px; }
.card h2 { font-family: var(--display); font-size: clamp(34px, 8vw, 64px); margin: 0; font-weight: 400; }
.card h2.win { color: var(--gold); text-shadow: 0 0 30px rgba(255,204,61,.5); animation: zoom .6s cubic-bezier(.2,1.6,.4,1); }
.card h2.lose { color: var(--bad); animation: zoom .6s; }
@keyframes zoom { from { transform: scale(2.4); opacity: 0; } }
.stats { display: flex; justify-content: center; gap: 24px; font-family: var(--display); }
.stats div span { display: block; font-family: var(--body); font-size: 11px; color: var(--mute); letter-spacing: .15em; }
.btn2 { padding: 12px; border-radius: 12px; background: rgba(255,255,255,.1); border: 1px solid var(--line); font-weight: 800; }
#toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); background: var(--paper); color: var(--ink); font-family: var(--display); padding: 10px 18px; border-radius: 999px; z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
#toast.in { animation: tin .3s; }
@keyframes tin { from { transform: translate(-50%, -20px); opacity: 0; } }
#rotate { display: none; }
@media (orientation: portrait) and (max-width: 600px) {
  #hud #rotate { display: block; position: absolute; left: 50%; top: 40%; transform: translateX(-50%); background: var(--glass); padding: 8px 14px; border-radius: 999px; font-size: 12px; white-space: nowrap; border: 1px solid var(--line); }
  .ubtn { width: 18vw; }
  .ubtn .nm { font-size: 9px; }
  .cmd { padding: 7px 8px; font-size: 10px; }
}
@media (max-height: 460px) {
  .logo { font-size: 26px; } .logo small { display: none; }
  .team canvas { width: 52px; height: 52px; }
  .ubtn { width: min(13vw, 76px); }
  .pane { padding: 10px; }
}
@media (prefers-reduced-motion: reduce) { .go { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<section class="screen" id="menu">
  <div class="top">
    <h1 class="logo">PIGMENT KRIEG<small>SCHWARZ GEGEN WEISS</small></h1>
    <div class="coins">🪙 <span class="coinv">0</span></div>
    <button class="snd" aria-label="Ton an oder aus">🔊</button>
  </div>
  <div class="panel">
    <nav class="tabs">
      <button class="tab" data-t="play">Schlacht</button>
      <button class="tab" data-t="shop">Helme</button>
      <button class="tab" data-t="upg">Waffen</button>
    </nav>
    <div class="pane" id="p_play">
      <h3>DEIN TEAM</h3>
      <div class="teams">
        <button class="team" id="team_black"><canvas width="140" height="140"></canvas><div><b>Schwarz</b><span>Das dunkle Pigment</span></div></button>
        <button class="team" id="team_white"><canvas width="140" height="140"></canvas><div><b>Weiß</b><span>Das helle Pigment</span></div></button>
      </div>
      <h3>ARENA</h3>
      <div class="arenas" id="arenas"></div>
      <button class="go" id="play">KAMPF STARTEN</button>
    </div>
    <div class="pane" id="p_shop" hidden>
      <h3>HELME FÜR DEINE ARMEE</h3>
      <div class="shop" id="shop"></div>
    </div>
    <div class="pane" id="p_upg" hidden>
      <h3>WAFFEN SCHMIEDEN · HOLZ → EISEN → GOLD → DIAMANT → PLASMA</h3>
      <div id="upg"></div>
    </div>
  </div>
</section>

<section class="screen" id="hud" hidden>
  <div class="hudtop">
    <div class="hpwrap"><div class="hplab"><span>DEINE BURG</span></div><div class="hpbar"><div id="hpL"></div></div></div>
    <div class="mid"><canvas id="mini" width="260" height="26"></canvas><span id="arenaName"></span></div>
    <div class="hpwrap"><div class="hplab"><span></span><span>FEIND</span></div><div class="hpbar" style="display:flex"><div id="hpR"></div></div></div>
    <button class="ibtn snd" aria-label="Ton an oder aus">🔊</button>
    <button class="ibtn" id="pauseBtn" aria-label="Pause">⏸</button>
  </div>
  <div id="gold">🪙 <span id="goldv">0</span> <small>☠ <span id="killv">0</span></small></div>
  <div class="cmds">
    <button class="cmd" id="cmdDef">🛡 VERTEIDIGEN</button>
    <button class="cmd on" id="cmdAtk">⚔ ANGRIFF</button>
  </div>
  <div id="rotate">↻ Dreh dein Handy quer</div>
  <div id="bar"><div id="units"></div></div>
</section>

<div class="modal" id="pause" hidden>
  <div class="card">
    <h2>PAUSE</h2>
    <button class="go" id="resume">WEITER</button>
    <button class="btn2" id="quit">Aufgeben &amp; zum Menü</button>
  </div>
</div>
<div class="modal" id="end" hidden>
  <div class="card">
    <h2 id="endTitle">SIEG!</h2>
    <p id="endSub" style="margin:0;color:var(--mute)"></p>
    <div class="stats"><div><span>BESIEGT</span><b id="endKills">0</b></div><div><span>MÜNZEN</span><b id="endCoins" style="color:var(--gold)">0</b></div></div>
    <button class="go" id="again">NOCHMAL</button>
    <button class="btn2" id="endMenu">Menü · Shop · Waffen</button>
  </div>
</div>
<div id="toast" hidden></div>

<script src="game.js"></script>
</body>
</html>
