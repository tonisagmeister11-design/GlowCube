<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Velora</title>
<link rel="stylesheet" href="maplibre-gl.css">
<style>
:root{--bg:#f3f6fa;--panel:#ffffff;--panel2:#eef3f8;--panel3:#e2eaf3;--line:#d5dfe9;--text:#13263a;--mute:#5f7184;--lime:#2fd59a;--acc:#0c9a68;--ink:#0d2b3e;--orange:#e8930c;--red:#e5463c;--blue:#2f80ed;--sea:#a8d5f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Roboto Condensed","Roboto",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
#map{position:absolute;inset:0;background:var(--sea)}
.maplibregl-map{font-family:inherit}
.maplibregl-canvas{outline:none}
.maplibregl-ctrl-attrib{background:rgba(255,255,255,.85)!important;color:#5f7184!important;font-size:9px;padding:0 5px!important}
.maplibregl-ctrl-attrib a{color:#3f5163!important}
.maplibregl-ctrl-bottom-left .maplibregl-ctrl{margin:0 0 6px 10px}
.maplibregl-ctrl-bottom-right .maplibregl-ctrl{margin:0}
.maplibregl-ctrl-scale{background:rgba(255,255,255,.85);color:#13263a;border-color:#5f7184;font-size:10px}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{transition:bottom .2s}
body.fs #top,body.fs #chips,body.fs #sheet,body.fs #gpswarn,body.fs #results,body.fs #climbBox,body.fs #btnZoomIn,body.fs #btnZoomOut,body.fs #btnIsland,body.fs #btnLayers{display:none!important}
#btnLayers{display:none!important}
body.fs #btnCompass{top:20px!important}
body.fs.navmode #btnCompass{top:58px!important}
#speedo .sp3{font-size:12px;color:var(--text);border-top:1px solid var(--line);padding-top:4px;width:100%;text-align:center;font-variant-numeric:tabular-nums;display:none}
body.navmode #speedo .sp3{display:block}
#top{position:absolute;top:10px;left:10px;right:10px;z-index:1000;display:flex;gap:8px}
.sbox{position:relative;flex:1}
#search{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 40px 0 44px;font-size:16px;outline:none;font-family:inherit}
#search:focus{border-color:var(--lime)}
.sbox .si{position:absolute;left:14px;top:14px;pointer-events:none}
#clr{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--mute);display:none}
.btn{height:48px;min-width:48px;border-radius:14px;border:1px solid var(--line);box-shadow:0 2px 8px rgba(19,38,58,.12);background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:15px;padding:0 12px;flex:none}
.btn:active{background:var(--panel2)}
.btn.on{border-color:var(--lime);color:var(--acc)}
#results{position:absolute;top:66px;left:10px;right:10px;max-height:60%;overflow:auto;z-index:1001;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:none}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--panel2)}
.row .t{font-size:16px;line-height:1.2}.row .s{font-size:13px;color:var(--mute);line-height:1.3}
.row .r{text-align:right;flex:none}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:36px;height:36px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--panel2)}
#chips{position:absolute;top:66px;left:0;right:0;z-index:999;display:flex;gap:6px;overflow-x:auto;padding:0 10px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:rgba(255,255,255,.96);color:var(--mute);box-shadow:0 1px 4px rgba(19,38,58,.12);font-size:14px;display:flex;align-items:center;gap:6px}
.chip.on{color:var(--ink);background:var(--lime);border-color:var(--lime);font-weight:600}
.chip.sm{height:30px;font-size:13px;padding:0 10px}
#side{position:absolute;right:10px;z-index:999;display:flex;flex-direction:column;gap:7px;transition:bottom .2s}
#side .btn{height:44px;min-width:44px;width:44px;padding:0;border-radius:13px}
#gpswarn{position:absolute;left:10px;right:10px;top:110px;z-index:998;background:#fdecea;border:1px solid #f3b4ad;color:#8a1f17;border-radius:12px;padding:10px 12px;font-size:14px;display:none;align-items:center;gap:10px}
#gpswarn button{margin-left:auto;background:var(--red);border:0;color:#fff;border-radius:9px;height:34px;padding:0 12px;font-size:14px}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(19,38,58,.12);border-radius:20px 20px 0 0;padding:0 16px 16px;max-height:52%;overflow:auto;overscroll-behavior:contain}
#sheet.mini{max-height:118px;overflow:hidden}
.grab{position:sticky;top:0;background:var(--panel);padding:9px 0 9px;margin:0 -16px 2px;z-index:2}
.grab div{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
h2{margin:0 0 3px;font-size:21px;font-weight:700;letter-spacing:.2px;line-height:1.15}
h3{margin:16px 0 6px;font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:1.2px}
.sub{color:var(--mute);font-size:14px;line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats.four{grid-template-columns:repeat(4,1fr);gap:6px}
.stats.four .stat{padding:8px}.stats.four b{font-size:17px}.stats.four span{font-size:10px;letter-spacing:.3px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--panel2);border-radius:12px;padding:9px 10px;min-width:0}
.stat b{display:block;font-size:21px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.w b{color:var(--text)}
.stat span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.go{width:100%;height:52px;border-radius:14px;border:0;background:var(--lime);color:var(--ink);font-size:18px;font-weight:700;letter-spacing:.4px}
.go:active{filter:brightness(.9)}
.go.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.go.red{background:var(--red);color:#fff}
.btns{display:flex;gap:8px;margin-top:10px}
.btns .go{flex:1}
.mix{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 6px;background:var(--panel2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.seg{display:flex;background:var(--panel2);border-radius:12px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:none;color:var(--mute);font-size:14px;white-space:nowrap;padding:0 4px}
.seg button.on{background:#ffffff;color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--lime)}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -16px;padding:0 16px}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:7px;background:var(--panel2);color:var(--mute);margin:0 4px 4px 0}
.tag.lime{background:rgba(47,213,154,.18);color:var(--acc)}
.tag.orange{background:rgba(255,176,32,.15);color:var(--orange)}
.tag.red{background:rgba(255,90,78,.15);color:var(--red)}
.card{background:var(--panel2);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid transparent}
.card:active{border-color:var(--line)}
.card.pick{border-width:2px;border-style:solid}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card .nm{font-size:17px;font-weight:700;line-height:1.2}
.card .meta{display:flex;gap:12px;font-size:13px;color:var(--mute);margin:6px 0 4px;flex-wrap:wrap}
.card .meta b{color:var(--text);font-weight:600}
.spark{display:block;width:100%;height:36px;margin-top:6px}
.prof{position:relative;margin:8px 0 2px;touch-action:none}
.prof svg{display:block;width:100%}
.climb{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.climb:last-child{border-bottom:0}
.gbar{width:6px;align-self:stretch;border-radius:3px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span{color:var(--mute)}
.kv:last-child{border-bottom:0}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--panel3);flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#ffffff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--lime)}.sw.on:after{left:21px;background:#ffffff}
.opt{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
input[type=range]{width:100%;accent-color:var(--lime);height:28px}
#nav{position:absolute;top:10px;left:10px;right:10px;z-index:1002;background:var(--lime);color:var(--ink);border-radius:16px;padding:10px 14px;display:none;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(19,38,58,.25)}
#nav .arrow{width:52px;height:52px;flex:none}
#nav .d{font-size:30px;font-weight:800;line-height:1}
#nav .w{font-size:16px;font-weight:600;opacity:.85;line-height:1.2;margin-top:2px}
#nav .then{font-size:13px;opacity:.7;margin-top:3px}
#navMute{margin-left:auto;width:42px;height:42px;border-radius:12px;border:2px solid rgba(13,43,62,.3);background:none;flex:none;display:flex;align-items:center;justify-content:center}
/* Vollbild: Abbiege-Hinweis als schmale Leiste ganz oben */
body.fs #nav{top:6px;left:8px;right:8px;padding:5px 8px 5px 10px;border-radius:12px;gap:8px;box-shadow:0 3px 10px rgba(19,38,58,.25)}
body.fs #nav .arrow{width:28px;height:28px}
body.fs #nav .grow{display:flex;align-items:baseline;gap:8px;min-width:0}
body.fs #nav .d{font-size:19px;flex:none}
body.fs #nav .w{font-size:13.5px;margin:0;flex:1;min-width:0}
body.fs #nav .then{display:none}
body.fs #navMute{width:30px;height:30px;border-radius:9px;border-width:1.5px}
body.fs #navMute svg{width:18px;height:18px}
#climbBox{position:absolute;top:96px;left:10px;right:10px;z-index:1001;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:none;font-size:14px;align-items:center;gap:10px}
#speedo{position:absolute;left:10px;z-index:999;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:14px;width:96px;padding:8px 6px 7px;display:none;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 14px rgba(19,38,58,.2)}
#speedo .sp1{display:flex;flex-direction:column;align-items:center}
#speedo .sp1 b{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#speedo .sp1 span{font-size:11px;color:var(--mute);letter-spacing:.5px}
#speedo .sp2{display:flex;align-items:baseline;gap:4px;border-top:1px solid var(--line);padding-top:4px;width:100%;justify-content:center}
#speedo .sp2 b{font-size:17px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
#speedo .sp2 span{font-size:13px;color:var(--mute)}
.leaflet-control-scale{margin-bottom:6px!important}
.hide{display:none!important}
body.navmode #btnCompass{top:150px!important}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:120px;z-index:1500;background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:85%;text-align:center;pointer-events:none}
.me{width:34px;height:34px;position:relative}
.me .dot{position:absolute;left:7px;top:7px;width:20px;height:20px;border-radius:50%;background:#1aa874;border:4px solid #ffffff;box-shadow:0 0 0 6px rgba(26,168,116,.25),0 2px 6px rgba(0,0,0,.3)}
.me svg{position:absolute;left:0;top:0;transition:transform .3s}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #ffffff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.pin svg{transform:rotate(45deg)}
.poi{width:26px;height:26px;border-radius:9px;border:2px solid #14181d;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.wp{width:22px;height:22px;border-radius:50%;border:3px solid #0d2b3e;background:#fff;color:#0d2b3e;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.lbl{color:#e3e9ee;font-size:13px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;text-shadow:0 0 4px #000,0 0 8px #000,0 0 2px #000;white-space:nowrap;pointer-events:none}
.lbl.small{font-size:10px;letter-spacing:1px;color:#b4bec7;font-weight:600}
.lbl.bay{font-size:10px;letter-spacing:.5px;color:#7fb6d6;font-style:italic;text-transform:none;font-weight:500}
.lbl.peak{font-size:10px;letter-spacing:.3px;color:#e9d8b4;text-transform:none;font-weight:600}
.lbl.ele{font-size:9px;letter-spacing:0;color:#a3b29a;text-transform:none;font-weight:500;opacity:.9}
a{color:var(--acc)}
.wx{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:9px 12px;margin:10px 0;font-size:14px}
.wx b{font-size:20px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
/* Juno-Chat */
#sheet.tall{max-height:78%}
.chatlog{display:flex;flex-direction:column;gap:8px;margin:8px 0 10px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.4;white-space:normal;word-wrap:break-word;-webkit-user-select:text;user-select:text}
.msg.mine{align-self:flex-end;background:var(--lime);color:var(--ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}
.msg.ai ul{margin:4px 0;padding-left:18px}
.msg.wait{color:var(--mute);display:flex;align-items:center;gap:12px;padding:10px 14px}
.jl-orb{position:relative;width:34px;height:34px;flex:none}
.jl-orb:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#2fd59a,#2f80ed,#8b5cf6,#e8930c,#2fd59a);animation:jlspin 1.4s linear infinite;-webkit-mask:radial-gradient(circle,transparent 12px,#000 13px);mask:radial-gradient(circle,transparent 12px,#000 13px)}
.jl-orb:after{content:"";position:absolute;inset:-4px;border-radius:50%;background:radial-gradient(circle,rgba(47,213,154,.35),transparent 70%);animation:jlpulse 1.6s ease-in-out infinite}
.jl-orb svg{position:absolute;left:8px;top:8px;animation:jlpop 1.6s ease-in-out infinite}
.jl-txt{display:flex;flex-direction:column;gap:5px;min-width:0}
.jl-lines{position:relative;height:18px;width:205px;overflow:hidden;font-size:14px;font-weight:600;color:var(--text)}
.jl-lines span{position:absolute;left:0;white-space:nowrap;opacity:0;animation:jlline 8s infinite}
.jl-lines span:nth-child(2){animation-delay:2s}.jl-lines span:nth-child(3){animation-delay:4s}.jl-lines span:nth-child(4){animation-delay:6s}
.jl-wave{display:flex;align-items:flex-end;gap:3px;height:12px}
.jl-wave i{width:4px;border-radius:2px;background:linear-gradient(#2fd59a,#2f80ed);animation:jlwave 1s ease-in-out infinite}
.jl-wave i:nth-child(2){animation-delay:.1s}.jl-wave i:nth-child(3){animation-delay:.2s}.jl-wave i:nth-child(4){animation-delay:.3s}.jl-wave i:nth-child(5){animation-delay:.4s}.jl-wave i:nth-child(6){animation-delay:.5s}.jl-wave i:nth-child(7){animation-delay:.6s}
@keyframes jlspin{to{transform:rotate(360deg)}}
@keyframes jlpulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
@keyframes jlpop{0%,100%{transform:scale(.9) rotate(0)}50%{transform:scale(1.1) rotate(15deg)}}
@keyframes jlwave{0%,100%{height:3px}50%{height:12px}}
@keyframes jlline{0%{opacity:0;transform:translateY(12px)}5%,22%{opacity:1;transform:none}27%,100%{opacity:0;transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.jl-orb:before,.jl-orb:after,.jl-orb svg,.jl-wave i{animation:none}.jl-lines span{animation:none}.jl-lines span:first-child{opacity:1}}
.msg .places{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg .places button,.msg .act{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:6px 9px;font-size:13px}
.msg .act{display:block;margin-top:8px;color:var(--acc);border-color:rgba(47,213,154,.6)}
.chatin{position:sticky;bottom:-16px;background:var(--panel);display:flex;gap:6px;padding:8px 0 4px;margin:0 -2px}
.chatin input{flex:1;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:0 12px;font-size:16px;font-family:inherit;outline:none}
.chatin input:focus{border-color:var(--lime)}
.chatin button{width:46px;height:46px;border-radius:13px;border:0;background:var(--lime);display:flex;align-items:center;justify-content:center;flex:none}
.chatin button.mic{background:var(--panel2);border:1px solid var(--line)}
.chatin button.mic.on{background:var(--red)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sugg button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:16px;padding:7px 11px;font-size:13.5px;font-family:inherit}
.junonote{background:rgba(47,213,154,.1);border:1px solid rgba(47,213,154,.45);border-radius:12px;padding:8px 10px;font-size:14px;margin:8px 0;line-height:1.35}
.junonote b.j{color:var(--acc)}
.quick button{background:var(--panel2);border:1px solid var(--line);border-radius:14px;color:var(--text);height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12.5px;padding:0 2px}
.quick button:active{background:var(--panel3)}
.empty{color:var(--mute);font-size:14px;padding:14px 0;text-align:center}
.okl{color:var(--acc)}.bad{color:var(--red)}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="sbox">
    <svg class="si" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#93a0ad" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="search" placeholder="Ort, Strand, Restaurant, Straße" autocomplete="off" spellcheck="false">
    <button id="clr"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <button class="btn" id="btnAi" title="Juno fragen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0c9a68" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/><path d="M19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z"/></svg></button>
  <button class="btn" id="btnTours" title="Touren">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3.5"/><circle cx="18" cy="17" r="3.5"/><path d="M6 17l4-8h6l2 8M10 9l3 8 3-8M9 6h3"/></svg>
  </button>
  <button class="btn" id="btnMenu" title="Menü">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</div>
<div id="results"></div>
<div id="chips"></div>
<div id="gpswarn"><span id="gpswarnText">GPS ist aus.</span><button id="gpswarnBtn">Einschalten</button></div>

<div id="nav">
  <svg class="arrow" viewBox="0 0 48 48"><path id="navPath" d="M24 42 L24 8 M13 19 L24 8 L35 19" fill="none" stroke="#14181d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="grow"><div class="d" id="navDist">-</div><div class="w ell" id="navText">-</div><div class="then ell" id="navThen"></div></div>
  <button id="navMute"></button>
</div>
<div id="climbBox"></div>
<div id="speedo"><div class="sp1"><b id="spd">0</b><span>km/h</span></div><div class="sp2"><span>&Oslash;</span><b id="avg">-</b></div><div class="sp3" id="spRem"></div></div>

  <button class="btn hide" style="position:absolute;left:10px;top:118px;z-index:999;width:44px;height:44px;min-width:44px;padding:0;border-radius:22px" id="btnCompass" title="Norden nach oben"><svg id="compassNeedle" width="26" height="26" viewBox="0 0 24 24" style="transition:none"><path d="M12 2 15.5 12h-7z" fill="#ff5a4e"/><path d="M12 22 8.5 12h7z" fill="#cfd6dd"/></svg></button>
<div id="side">
  <button class="btn" id="btnFull" title="Vollbild"></button>
  <button class="btn" id="btnZoomIn" title="Hineinzoomen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="btn" id="btnZoomOut" title="Herauszoomen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="btn" id="btnLoc" title="Mein Standort">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
  <button class="btn" id="btnIsland" title="Ganze Insel">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5zM9 4v13.5M15 6.5V20"/></svg>
  </button>
  <button class="btn" id="btnLayers" title="Kartenebenen">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5zM2 13l10 5 10-5M2 17.5l10 5 10-5"/></svg>
  </button>
</div>

<div id="sheet"></div>

<script src="maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
