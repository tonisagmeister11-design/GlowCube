// BikeOra: offizieller Android-Build (Gradle + Android Gradle Plugin). Die Quellen liegen weiter in app/.
pluginManagement {
    // Google-Spiegel von Maven Central zuerst (Maven Central drosselt manche Netze)
    repositories { google(); maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }; mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }; mavenCentral() }
}
rootProject.name = 'BikeOra'
include ':app'
